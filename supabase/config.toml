project_id = "vyewakyciuhlrgzmxkwk"

[auth]
site_url = "REPLACE_WITH_DEPLOYED_URL"

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your ProYard Sales Map account"
content_path = "./supabase/templates/confirmation.html"

[functions.get-mapbox-token]
verify_jwt = false

# Called only by the accounts_activated_notify trigger (internal,
# service-to-service) — no end-user session to verify a JWT against.
[functions.notify-n8n-status-change]
verify_jwt = false

# Called only by the account_events_quote_created_notify trigger (internal,
# service-to-service) — no end-user session to verify a JWT against.
[functions.notify-n8n-quote-created]
verify_jwt = false

# Called by n8n after it generates a quote's Google Doc — no end-user
# session; authenticated via the X-N8N-Secret header instead.
[functions.n8n-update-quote-doc]
verify_jwt = false

# Called only by the accounts_canceled_notify trigger (internal,
# service-to-service) — no end-user session to verify a JWT against.
[functions.notify-n8n-status-canceled]
verify_jwt = false
